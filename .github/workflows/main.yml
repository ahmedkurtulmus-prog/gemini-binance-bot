name: Binance Bot 7/24

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # GitHub zaman aşımı sınırına takılmasın diye her 6 saatte bir otomatik tetikler

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repo dosyalarını çek
      uses: actions/checkout@v4

    - name: Python Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Kütüphaneleri Yükle
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Botu Başlat
      run: |
        python main.py
